# git-cliff configuration for fd.
#
# CHANGELOG.md stays hand-written and authoritative for release history; this file
# produces the GitHub release notes for a tag from the same Conventional Commit stream.
# Section names follow Keep a Changelog.
[changelog]
header = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} - **BREAKING**: {{ commit.breaking_description }}{% endif %}
{%- endfor %}
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = '^Merge (pull request|branch)', skip = true },
  { message = '^chore\(release\)', skip = true },
  { message = '^chore\(deps', group = 'Dependencies' },
  { message = '^chore\(ci|docker\)', group = 'CI and build' },
  { message = '^chore', group = 'Internal' },
  { message = '^test', group = 'Tests' },
  { message = '^docs', group = 'Documentation' },
  { message = '^perf', group = 'Performance' },
  { message = '^refactor', group = 'Refactoring' },
  { message = '^revert', group = 'Reverted' },
  { message = '^feat', group = 'Added' },
  { message = '^fix', group = 'Fixed' },
  { message = '^security', group = 'Security' },
  { message = '^style', skip = true },
]
