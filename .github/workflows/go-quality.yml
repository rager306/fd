name: Go Quality

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
      - ".golangci.yml"
      - ".github/workflows/go-quality.yml"
      - "README.md"
  pull_request:
    branches:
      - master
    paths:
      - "api/**"
      - ".golangci.yml"
      - ".github/workflows/go-quality.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go tests and lint
    runs-on: ubuntu-latest
    # M043: timeout bumped from 10 to 20 minutes after enabling 18 linters
    # plus standalone govulncheck. go run downloads are cached by setup-go,
    # but first-run CI needs headroom.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the floor from the module instead of resolving "1.26.x" here:
          # the runner toolcache served 1.26.9 while the module already required
          # the stdlib fix for GO-2026-6809 (crypto/x509) from 1.26.10, so CI ran
          # a toolchain older than the one the code declares.
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Run Go tests
        working-directory: api
        run: go test ./... -short -count=1

      - name: Run go vet
        working-directory: api
        run: go vet ./...

      - name: Run GolangCI-Lint with Staticcheck + Tier 1/2 linters
        working-directory: api
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 \
            run --config ../.golangci.yml ./...
        # M043 S01/S02: this step now runs 18 linters (M040 baseline 7 +
        # Tier 1 5 + Tier 2 6). All in fail mode. See .golangci.yml.

      - name: Run govulncheck
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        # M043 S03: govulncheck is standalone (not a golangci-lint plugin).
        # It fails CI when the code reaches a known vulnerability in stdlib or deps.
